server:
  port: 3001
  shutdown: graceful
spring:
  application:
    name: hookroute-worker
  datasource:
    url: jdbc:postgresql://localhost:5432/hookroute
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      url: redis://localhost:6379
  threads:
    virtual:
      enabled: true
hookroute:
  worker:
    enabled: true
  queue:
    main-stream: webhook-events
    dead-letter-stream: webhook-events-dlq
    consumer-group: hookroute-workers
    consumer-name: worker
    batch-size: 10
    poll-delay-ms: 250
    visibility-timeout-ms: 30000
  outbox:
    poll-delay-ms: 200
  egress:
    mode: simulated
    destination-base-url: https://example.com/webhooks
    timeout-ms: 3000
    simulated-latency-ms: 50
    circuit-failure-threshold: 3
    circuit-open-ms: 30000
    allow-payload-simulation: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
logging:
  structured:
    format:
      console: logstash
