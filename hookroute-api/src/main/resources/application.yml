server:
  port: 3000
  shutdown: graceful
spring:
  application:
    name: hookroute-api
  datasource:
    url: jdbc:postgresql://localhost:5432/hookroute
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      url: redis://localhost:6379
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  threads:
    virtual:
      enabled: true
hookroute:
  worker:
    enabled: false
  security:
    webhook-secret: ""
    signature-tolerance-ms: 300000
  egress:
    mode: simulated
    destination-base-url: https://example.com/webhooks
    timeout-ms: 3000
    simulated-latency-ms: 50
    circuit-failure-threshold: 3
    circuit-open-ms: 30000
    allow-payload-simulation: true
springdoc:
  swagger-ui:
    path: /docs
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
logging:
  structured:
    format:
      console: logstash
