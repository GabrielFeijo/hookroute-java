services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hookroute"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hookroute
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_URL: redis://redis:6379
      HOOKROUTE_SECURITY_ADMIN_API_KEY: ${HOOKROUTE_SECURITY_ADMIN_API_KEY:-}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hookroute
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_URL: redis://redis:6379
      HOOKROUTE_EGRESS_MODE: simulated
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
